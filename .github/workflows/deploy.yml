name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

permissions:
  id-token: write  # Required for OIDC token
  contents: read

env:
  TERRAFORM_VERSION: '1.6.0'
  ALIYUN_REGION: 'cn-shanghai'

jobs:
  # Job 1: Deploy Infrastructure with Terraform
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun CLI
        run: |
          wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: OIDC Authentication
        env:
          ROLE_TO_ASSUME: ${{ secrets.TERRAFORM_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.OIDC_PROVIDER_ARN }}
          OIDC_AUDIENCE: github-actions
          ROLE_SESSION_NAME: terraform-deploy-${{ github.run_id }}
        run: |
          chmod +x scripts/oidc_auth.sh
          ./scripts/oidc_auth.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure Terraform Mirror
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/.terraformrc << 'EOF'
          provider_installation {
            network_mirror {
              url = "https://mirrors.aliyun.com/terraform/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Terraform Init
        run: |
          export ALICLOUD_ACCESS_KEY=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          export ALICLOUD_SECRET_KEY=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          export ALICLOUD_SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)
          terraform init -upgrade
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_wechat_app_id: ${{ secrets.WECHAT_APP_ID }}
          TF_VAR_wechat_app_secret: ${{ secrets.WECHAT_APP_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          export ALICLOUD_ACCESS_KEY=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          export ALICLOUD_SECRET_KEY=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          export ALICLOUD_SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)
          terraform plan -out=tfplan -detailed-exitcode
        working-directory: terraform
        continue-on-error: true

      - name: Upload Terraform Plan
        if: steps.plan.outcome == 'changes'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1

      - name: Terraform Apply (manual trigger)
        if: steps.plan.outcome == 'changes'
        run: |
          echo "Terraform changes detected. Run 'terraform apply' manually to review."
          echo "Plan uploaded as artifact for review."
        continue-on-error: true

  # Job 2: Deploy FC Function
  deploy-function:
    name: Deploy FC Function
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: always() && needs.deploy-infra.result != 'failure'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun CLI
        run: |
          wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: OIDC Authentication
        env:
          ROLE_TO_ASSUME: ${{ secrets.FC_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.OIDC_PROVIDER_ARN }}
          OIDC_AUDIENCE: github-actions
          ROLE_SESSION_NAME: fc-deploy-${{ github.run_id }}
        run: |
          chmod +x scripts/oidc_auth.sh
          ./scripts/oidc_auth.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python Dependencies
        run: pip install --target python/ -r requirements.txt

      - name: Deploy FC Function
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VPC_ID: ${{ secrets.VPC_ID }}
          VSWITCH_ID: ${{ secrets.VSWITCH_ID }}
          SECURITY_GROUP_ID: ${{ secrets.SECURITY_GROUP_ID }}
        run: |
          ACCESS_KEY_ID=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          ACCESS_KEY_SECRET=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)
          export ALIBABA_CLOUD_ACCESS_KEY_ID="$ACCESS_KEY_ID"
          export ALIBABA_CLOUD_ACCESS_KEY_SECRET="$ACCESS_KEY_SECRET"
          export ALIBABA_CLOUD_SECURITY_TOKEN="$SECURITY_TOKEN"

          # Package code
          zip -rq function_code.zip . \
            -x "*.git*" "*.github*" "terraform/*" "scripts/*" "openspec/*" "tests/*" ".claude/*" \
            "babynote/*" "docs/*" "config/*" "*.md" "*.log" ".gitignore" \
            ".env.example" "s.yaml" "s.yaml.*" "alembic.ini" "Dockerfile*" \
            "function_code.zip" "python/.*" ".mypy_cache/*"

          # Step 1: Create a session to upload code
          SESSION=$(aliyun fc CreateSession --functionName api --body '{}' 2>/dev/null | jq -r '.sessionId')
          echo "Created session: $SESSION"

          # Step 2: Upload code to session
          python3 scripts/build_fc_body.py function_code.zip /tmp/fc_code_body.json
          aliyun fc UpdateSession --functionName api --sessionId "$SESSION" --body file:///tmp/fc_code_body.json

          # Step 3: Update function configuration
          aliyun fc UpdateFunction --functionName api --body "$(jq -n \
            --arg db "$DATABASE_URL" \
            --arg wid "$WECHAT_APP_ID" \
            --arg ws "$WECHAT_APP_SECRET" \
            --arg js "$JWT_SECRET" \
            '{Handler:"src.api.index.handler",Runtime:"python3.9",MemorySize:256,Timeout:30,EnvironmentVariables:{DATABASE_URL:$db,WECHAT_APP_ID:$wid,WECHAT_APP_SECRET:$ws,JWT_SECRET:$js,JWT_ALGORITHM:"HS256",JWT_EXPIRE_MINUTES:"10080"}}')"

          echo "FC function updated successfully"

  # Job 3: Verify Deployment
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-function
    if: always() && needs.deploy-function.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun CLI
        run: |
          wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: OIDC Authentication
        env:
          ROLE_TO_ASSUME: ${{ secrets.FC_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.OIDC_PROVIDER_ARN }}
          OIDC_AUDIENCE: github-actions
          ROLE_SESSION_NAME: verify-${{ github.run_id }}
        run: |
          chmod +x scripts/oidc_auth.sh
          ./scripts/oidc_auth.sh

      - name: Health Check
        run: |
          ENDPOINT=$(aliyun fc GET /2023-03-30/functions/baby-diary-service.api/httpTrigger 2>/dev/null | jq -r '.url' || echo "")

          if [ -z "$ENDPOINT" ]; then
            echo "Warning: Could not get HTTP trigger endpoint"
            exit 0
          fi

          echo "API Endpoint: $ENDPOINT"
          curl -s "$ENDPOINT/api/health" || echo "Health check completed"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
