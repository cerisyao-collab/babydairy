name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

permissions:
  id-token: write  # Required for OIDC token
  contents: read

env:
  TERRAFORM_VERSION: '1.6.0'
  ALIYUN_REGION: 'cn-shanghai'

jobs:
  # Job 1: Deploy Infrastructure with Terraform
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun CLI
        run: |
          wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: OIDC Authentication
        env:
          ROLE_TO_ASSUME: ${{ secrets.TERRAFORM_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.OIDC_PROVIDER_ARN }}
          OIDC_AUDIENCE: github-actions
          ROLE_SESSION_NAME: terraform-deploy-${{ github.run_id }}
        run: |
          chmod +x scripts/oidc_auth.sh
          ./scripts/oidc_auth.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure Terraform Mirror
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/.terraformrc << 'EOF'
          provider_installation {
            network_mirror {
              url = "https://mirrors.aliyun.com/terraform/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Terraform Init
        run: |
          export ALICLOUD_ACCESS_KEY=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          export ALICLOUD_SECRET_KEY=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          export ALICLOUD_SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)
          terraform init -upgrade
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_wechat_app_id: ${{ secrets.WECHAT_APP_ID }}
          TF_VAR_wechat_app_secret: ${{ secrets.WECHAT_APP_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          export ALICLOUD_ACCESS_KEY=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          export ALICLOUD_SECRET_KEY=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          export ALICLOUD_SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)
          terraform plan -out=tfplan -detailed-exitcode -target=alicloud_vpc.main -target=alicloud_vswitch.rds -target=alicloud_vswitch.fc -target=alicloud_security_group.rds -target=alicloud_db_instance.postgres -target=alicloud_oss_bucket.secrets -target=alicloud_ram_role.fc_deploy -target=alicloud_ram_policy.fc_deploy -target=alicloud_ram_policy.terraform_deploy -target=alicloud_ram_role.terraform_deploy
        working-directory: terraform
        continue-on-error: true

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && steps.plan.outcome == 'success'
        run: |
          export ALICLOUD_ACCESS_KEY=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          export ALICLOUD_SECRET_KEY=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          export ALICLOUD_SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)
          terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Upload Terraform Plan
        if: steps.plan.outcome == 'changes'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1

  # Job 2: Deploy FC Function
  deploy-function:
    name: Deploy FC Function
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: always() && needs.deploy-infra.result != 'failure'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun CLI
        run: |
          wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: Install Serverless Devs
        run: |
          npm install -g @serverless-devs/s

      - name: OIDC Authentication
        env:
          ROLE_TO_ASSUME: ${{ secrets.FC_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.OIDC_PROVIDER_ARN }}
          OIDC_AUDIENCE: github-actions
          ROLE_SESSION_NAME: fc-deploy-${{ github.run_id }}
        run: |
          chmod +x scripts/oidc_auth.sh
          ./scripts/oidc_auth.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Grant Temp Code Bucket Permission
        run: |
          # Add fc:GrantTempCodeBucketPermission to the fc-deploy policy directly via CLI
          # This is needed for Serverless Devs to upload code
          aliyun ram CreatePolicy --PolicyName "baby-diary-fc-code-upload" \
            --PolicyType "Custom" \
            --Description "Allow FC code upload via Serverless Devs" \
            --PolicyDocument '{"Version":"1","Statement":[{"Effect":"Allow","Action":["fc:GrantTempCodeBucketPermission"],"Resource":["acs:fc:*:*:services/baby-diary-*"]}]}' 2>/dev/null || true
          aliyun ram AttachPolicyToRole --PolicyName "baby-diary-fc-code-upload" \
            --PolicyType "Custom" --RoleName "baby-diary-fc-deploy"

      - name: Configure Serverless Devs Access
        run: |
          ACCESS_KEY_ID=$(jq -r '.profiles[0].access_key_id' ~/.aliyun/config.json)
          ACCESS_KEY_SECRET=$(jq -r '.profiles[0].access_key_secret' ~/.aliyun/config.json)
          SECURITY_TOKEN=$(jq -r '.profiles[0].sts_token' ~/.aliyun/config.json)

          s config add \
            --AccessKeyID "$ACCESS_KEY_ID" \
            --AccessKeySecret "$ACCESS_KEY_SECRET" \
            --SecurityToken "$SECURITY_TOKEN" \
            -a default

      - name: Install Python Dependencies
        run: |
          pip install --target python/ -r requirements.txt

      - name: Deploy FC Function
        env:
          VPC_ID: ${{ secrets.VPC_ID }}
          VSWITCH_ID: ${{ secrets.VSWITCH_ID }}
          SECURITY_GROUP_ID: ${{ secrets.SECURITY_GROUP_ID }}
          OSS_SECRETS_BUCKET: ${{ secrets.OSS_SECRETS_BUCKET }}
          OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          chmod +x scripts/fc_deploy.sh
          ./scripts/fc_deploy.sh

  # Job 3: Verify Deployment
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-function
    if: always() && needs.deploy-function.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun CLI
        run: |
          wget -q https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/
          aliyun version

      - name: OIDC Authentication
        env:
          ROLE_TO_ASSUME: ${{ secrets.FC_DEPLOY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.OIDC_PROVIDER_ARN }}
          OIDC_AUDIENCE: github-actions
          ROLE_SESSION_NAME: verify-${{ github.run_id }}
        run: |
          chmod +x scripts/oidc_auth.sh
          ./scripts/oidc_auth.sh

      - name: Health Check
        run: |
          ENDPOINT=$(aliyun fc GET /2023-03-30/functions/baby-diary-service.api/httpTrigger 2>/dev/null | jq -r '.url' || echo "")

          if [ -z "$ENDPOINT" ]; then
            echo "Warning: Could not get HTTP trigger endpoint"
            exit 0
          fi

          echo "API Endpoint: $ENDPOINT"

          curl -s "$ENDPOINT/api/health" || echo "Health check completed"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
