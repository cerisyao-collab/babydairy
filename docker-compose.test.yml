version: '3.8'

services:
  test-db:
    image: postgres:14
    container_name: baby-diary-test-db
    environment:
      POSTGRES_DB: baby_diary_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d baby_diary_test"]
      interval: 2s
      timeout: 5s
      retries: 10