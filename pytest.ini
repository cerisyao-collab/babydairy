[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (no database required)
    integration: Integration tests (requires Docker test database)
addopts = -v --tb=short --strict-markers
filterwarnings =
    ignore::DeprecationWarning
env_files =
    .env.test