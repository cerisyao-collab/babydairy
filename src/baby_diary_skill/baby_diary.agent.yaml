# Baby Diary - OpenClaw Agent Configuration
# 宝宝日记 - 小龙虾 Agent 配置文件
#
# This file defines the baby diary skill as an OpenClaw agent.
# 此文件将宝宝日记技能定义为 OpenClaw agent。

---
# Agent Metadata / Agent 元数据
agent:
  name: baby_diary
  description: 新生儿日常记录技能，支持喂奶、大小便、营养品、洗澡、睡眠、生长指标、病情等记录
  version: "1.3.0"
  author: babyjour
  license: MIT

# Skill Entry Point / 技能入口
entry_point: __init__.py

# Record Types / 记录类型
record_types:
  - value: feeding
    label: 喂奶
  - value: bowel
    label: 大便
  - value: urine
    label: 小便
  - value: medication
    label: 营养品
  - value: bathing
    label: 洗澡
  - value: sleep
    label: 睡眠
  - value: growth
    label: 生长指标
  - value: illness
    label: 病情

# Endpoints / 技能端点
endpoints:
  # ==================== Record Management / 记录管理 ====================

  - name: record_create
    description: 创建新记录
    function: record_create
    triggers:
      - "记录宝宝.*"
      - "创建.*记录"
      - "添加.*记录"
      - "记一下.*"
    parameters:
      - name: record_type
        type: string
        required: true
        description: 记录类型
        options: [feeding, bowel, urine, medication, bathing, sleep, growth, illness]
      - name: details
        type: object
        required: true
        description: 类型特定的详情字段
      - name: timestamp
        type: string
        required: false
        description: ISO 时间戳，默认当前时间
      - name: images
        type: array
        items: string
        required: false
        description: 图片路径列表
    returns: 创建的记录对象

  - name: record_query
    description: 查询记录
    function: record_query
    triggers:
      - "查询记录.*"
      - "查看.*记录"
      - "找.*记录"
      - "搜索.*记录"
    parameters:
      - name: start_date
        type: string
        required: false
        description: 开始日期 (YYYY-MM-DD)
      - name: end_date
        type: string
        required: false
        description: 结束日期 (YYYY-MM-DD)
      - name: record_type
        type: string
        required: false
        description: 记录类型过滤
        options: [feeding, bowel, urine, medication, bathing, sleep, growth, illness]
    returns: 记录列表

  - name: record_list
    description: 列出某日的所有记录
    function: record_list
    triggers:
      - "今天.*记录"
      - "昨天.*记录"
      - ".*日的记录"
      - "列出.*记录"
    parameters:
      - name: date
        type: string
        required: false
        description: 日期 (YYYY-MM-DD)，默认今天
    returns: 该日的记录列表

  - name: record_get
    description: 按 ID 获取单条记录
    function: record_get
    triggers:
      - "获取记录.*"
      - "记录详情.*"
      - "查看这条记录"
    parameters:
      - name: record_id
        type: string
        required: true
        description: 记录 ID
    returns: 单条记录对象，未找到返回 null

  - name: record_update
    description: 更新现有记录
    function: record_update
    triggers:
      - "更新记录.*"
      - "修改.*记录"
      - "更改.*记录"
      - "修正.*记录"
    parameters:
      - name: record_id
        type: string
        required: true
        description: 要更新的记录 ID
      - name: details
        type: object
        required: false
        description: 更新的详情字段
      - name: timestamp
        type: string
        required: false
        description: 更新时间戳 (ISO 格式)
      - name: images
        type: array
        items: string
        required: false
        description: 更新的图片路径列表
    returns: 更新后的记录对象

  - name: record_delete
    description: 删除记录
    function: record_delete
    triggers:
      - "删除记录.*"
      - "移除.*记录"
      - "删掉.*记录"
    parameters:
      - name: record_id
        type: string
        required: true
        description: 要删除的记录 ID
    returns: 删除成功返回 true

  # ==================== Image Viewing / 图片查看 ====================

  - name: image_view
    description: 查看记录中的单张图片
    function: image_view
    triggers:
      - "查看图片.*"
      - "看.*照片"
      - "显示.*图片"
    parameters:
      - name: record_id
        type: string
        required: true
        description: 记录 ID
      - name: image_index
        type: integer
        required: false
        default: 0
        description: 图片索引（从 0 开始）
    returns: 包含图片 markdown 的字典

  - name: list_images
    description: 列出记录中的所有图片（带缩略图）
    function: list_images
    triggers:
      - "列出图片.*"
      - "所有照片.*"
      - "有哪些图片.*"
    parameters:
      - name: record_id
        type: string
        required: true
        description: 记录 ID
    returns: 包含图片列表和缩略图的字典

  - name: image_gallery
    description: 以画廊形式展示记录中的所有图片
    function: image_gallery
    triggers:
      - "画廊模式.*"
      - "浏览图片.*"
      - "图片画廊.*"
    parameters:
      - name: record_id
        type: string
        required: true
        description: 记录 ID
    returns: 包含图片画廊 markdown 的字典

# Natural Language Patterns / 自然语言模式
patterns:
  # Time expressions / 时间表达式
  today: "今天|今日|今朝"
  yesterday: "昨天|昨日|昨个"
  tomorrow: "明天|明日"

  # Record type aliases / 记录类型别名
  feeding: "喂奶|喝奶|吃奶|哺乳|亲喂|瓶喂"
  bowel: "大便|拉屎|臭臭|便便"
  urine: "小便|尿尿|嘘嘘"
  medication: "营养品|吃药|补充剂|维生素|AD|DHA"
  bathing: "洗澡|沐浴|游泳"
  sleep: "睡觉|睡眠|午睡|小睡"
  growth: "生长指标|体重|身高|体温"
  illness: "病情|生病|发烧|咳嗽|感冒|看病"

# Usage Examples / 使用示例
examples:
  - input: "记录宝宝今天喝了 150ml 奶粉"
    endpoint: record_create
    params:
      record_type: feeding
      details:
        feeding_type: formula
        amount_ml: 150

  - input: "查询今天的记录"
    endpoint: record_list
    params:
      date: today

  - input: "宝宝发烧 38.5 度，有点咳嗽"
    endpoint: record_create
    params:
      record_type: illness
      details:
        symptom: 发烧、咳嗽
        temperature: "38.5°C"

  - input: "查看这张图片"
    endpoint: image_view
    params:
      record_id: "<record_id>"
      image_index: 0
