[skill]
name = "baby_diary"
version = "1.3.0"
description = "新生儿日常记录技能，支持喂奶、大小便、营养品、洗澡、睡眠、生长指标、病情等记录的创建、查询、更新和删除，支持图片查看"
author = "babyjour"
entry_point = "__init__.py"

[skill.dependencies]
python = ">=3.7"
pillow = ">=9.0.0"
pillow-heif = ">=0.12.0"

[skill.endpoints]
record_create = "创建新记录"
record_query = "查询记录"
record_list = "列出某日记录"
record_get = "按 ID 获取单条记录"
record_update = "更新现有记录"
record_delete = "删除记录"
image_view = "查看记录中的图片"
list_images = "列出记录中的所有图片"
image_gallery = "以画廊形式展示图片"
